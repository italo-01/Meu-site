<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italo Costa | Link na Bio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #121212;
            --border-color: #262626;
            --accent-color: #ffffff;
            --text-primary: #f5f5f5;
            --text-secondary: #a3a3a3;
            --font-family: 'Inter', system-ui, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* Profile Section */
        .profile {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            animation: fadeInDown 0.6s ease-out;
        }

        .profile-img-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #444, #111);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: var(--card-bg);
            border: 3px solid var(--bg-color);
        }

        .profile-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.025em;
        }

        .profile-info p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* Badges */
        .badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .badge {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.025em;
        }

        /* Links Section */
        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease-out backwards;
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background-color: var(--accent-color);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* Staggered animation delays */
        .link-card:nth-child(1) { animation-delay: 0.1s; }
        .link-card:nth-child(2) { animation-delay: 0.2s; }
        .link-card:nth-child(3) { animation-delay: 0.3s; }

        .link-card:hover {
            transform: translateY(-2px);
            border-color: #404040;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            background-color: #1a1a1a;
        }

        .link-card:hover::before {
            opacity: 1;
        }

        .icon-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-right: 1rem;
            color: var(--text-primary);
            transition: color 0.3s ease;
        }

        .link-card:hover .icon-container {
            color: var(--accent-color);
        }

        .icon-container svg {
            width: 24px;
            height: 24px;
        }

        .link-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .link-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.1rem;
        }

        .link-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .arrow-icon {
            color: var(--text-secondary);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-card:hover .arrow-icon {
            transform: translateX(4px);
            color: var(--accent-color);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            animation: fadeIn 1s ease-out 0.8s backwards;
        }

        .footer p {
            margin-bottom: 0.25rem;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header / Perfil -->
        <header class="profile">
            <div class="profile-info">
                <h1>Italo Costa</h1>
                <p>Engenharia de Software</p>
            </div>
            <div class="badges">
                <span class="badge">Java</span>
                <span class="badge">Spring Boot</span>
                <span class="badge">AWS</span>
            </div>
        </header>

        <!-- Lista de Links -->
        <main class="links">
            <!-- GitHub -->

                    </svg>
                </div>
                <div class="link-content">
                    <span class="link-title">GitHub</span>
                    <span class="link-desc">Repositórios e Projetos</span>
                </div>
                <div class="arrow-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>

            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/italo-costa/" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                    </svg>
                </div>
                <div class="link-content">
                    <span class="link-title">LinkedIn</span>
                    <span class="link-desc">Conexões profissionais e carreira</span>
                </div>
                <div class="arrow-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>

            <!-- AWS Builder Profile -->
            <a href="https://builder.aws.com/profile?tab=badges" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="icon-container">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
                    </svg>
                </div>
                <div class="link-content">
                    <span class="link-title">AWS Builder Profile</span>
                    <span class="link-desc">Artigos, badges e comunidade Cloud</span>
                </div>
                <div class="arrow-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
        </main>

        <!-- Rodapé -->
        <footer class="footer">
            <p>© 2026 • Minas Gerais</p>
        </footer>
    </div>
</body>
</html>
